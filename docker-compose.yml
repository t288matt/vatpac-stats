services:
  # PostgreSQL Database for VATSIM data
  postgres:
    image: postgres:16
    container_name: vatsim_postgres
    environment:
      POSTGRES_DB: vatsim_data
      POSTGRES_USER: vatsim_user
      POSTGRES_PASSWORD: vatsim_password
      # Memory optimization settings
      POSTGRES_SHARED_BUFFERS: 4GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 16GB
      POSTGRES_WORK_MEM: 128MB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
    volumes:
      - ./database/vatsim:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts:/scripts:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    #check postgres is up before allowing app to connect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatsim_user -d vatsim_data"]
      interval: 10s        # Faster checks for CI/CD
      timeout: 5s          # Faster timeouts for CI/CD
      retries: 6           # Fewer retries for CI/CD
      start_period: 30s    # Shorter grace period for CI/CD

  # Main Application (API-First Architecture)
  app:
    build:                                     #dev only - remove for prod  
      context: .                                #dev only - remove for prod
      dockerfile: Dockerfile                    #dev only - remove for prod
  ## image: ghcr.io/t288matt/vatpac-stats:latest   #prod only  remove for dev
    container_name: vatsim_app
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://vatsim_user:vatsim_password@postgres:5432/vatsim_data
      
      LOG_LEVEL: "INFO"
      
     
      # VATSIM Data Collection Intervals (seconds)
      VATSIM_POLLING_INTERVAL: 90    # How often to fetch VATSIM data (60 seconds)
      VATSIM_TRANSCEIVERS_POLLING_INTERVAL: 120  # How often to fetch transceivers-data.json (seconds)
      # VATSIM API retry attempts removed; service now logs and handles failures gracefully
      
      
            
      # Database Configuration
      # Pool size and max overflow are now hard-coded in the application
      
      
      # API Configuration
      API_WORKERS: 4                 # Number of API workers
      API_DEBUG: "false"             # Enable API debug mode
      API_RELOAD: "false"            # Enable API auto-reload
      CORS_ORIGINS: "*"              # CORS allowed origins
      
      # Logging Configuration - Using hardcoded defaults in application
      

      
      # Geographic Boundary Filter Configuration (Polygon-based)
      ENABLE_BOUNDARY_FILTER: "true"
      
      # Callsign Pattern Filter Configuration
      EXCLUDED_CALLSIGN_PATTERNS: "ATIS,_OBS"  #atis filtered out of contrllers data
      
      # Frequency Pattern Filter Configuration (exclude UNICOM frequencies)
      EXCLUDED_FREQUENCIES_MHZ: "122.800"  # Exclude 122.8 MHz UNICOM frequency
      
      # Flight Summary System Configuration (used by DataService)
      FLIGHT_SUMMARY_ENABLED: "true"          # Enable flight summary processing
      FLIGHT_COMPLETION_HOURS: 8             # Hours after first logon to mark flight as complete. effectively the long fligth time that can happen
      FLIGHT_RETENTION_HOURS: 168000000            # Hours to keep detailed flight data in the archive tables (approx)
      FLIGHT_DAYS_BEFORE_ARCHIVE: "90"              # Days before flight data is archived in the archive tables

      # Adaptive flight summary batching configuration
      # REMOVED: FLIGHT_SUMMARY_MAX_BATCH limit - system processes all qualifying sessions
      # The system has proven it can handle unlimited batch sizes efficiently
      # When a scheduled run processes the full batch (i.e. hit FLIGHT_SUMMARY_MAX_BATCH),
      # the scheduler will sleep this short interval (in seconds) before attempting another batch
      # to continue draining backlog without waiting the full interval. Set to 1 minute (60s).
      FLIGHT_SUMMARY_POLL_INTERVAL_SHORT: 60
      # When a scheduled run processes less than the batch size (backlog likely drained),
      # the scheduler will sleep this longer interval (in seconds) between runs. Set to 15 minutes (900s).
      FLIGHT_SUMMARY_POLL_INTERVAL_LONG: 900
      
      # Sector Tracking Configuration (used by DataService)
      SECTOR_TRACKING_ENABLED: "true"         # Enable real-time sector occupancy tracking
      SECTOR_UPDATE_INTERVAL: 60              #i dont thjink this is used anymore. delete?
            
      # Cleanup Configuration
      # How long (in seconds) a flight must be without updates before being considered "stale"
      # Stale flights have their open sector entries automatically closed with last known position
      # Default: 300 seconds (5 minutes) - adjust based on VATSIM data update frequency
      CLEANUP_FLIGHT_TIMEOUT: 300

      # Controller Summary Configuration (used by DataService)
      CONTROLLER_SUMMARY_ENABLED: "true"
      CONTROLLER_COMPLETION_MINUTES: "15"     # Inactivity threshold. After a controller has no updates for this many minutes, their session is considered “complete” and becomes eligible for summarization on the next run.
      CONTROLLER_RETENTION_HOURS: "1680000000"  # Max retention time for completed controller sessions. Once eligible for summarization, sessions will be archived and deleted after this time period.
      CONTROLLER_SUMMARY_INTERVAL: "30"   # Scheduler cadence. How often the background task runs to process/archive any sessions that have become eligible.
      CONTROLLER_RECONNECTION_THRESHOLD_MINUTES: "5"  # Minutes to merge controller reconnections into one session
      CONTROLLER_DAYS_BEFORE_ARCHIVE: "120"            # Days before controller data is archived in the archive tables
      
      # Shared Configuration for Both Detection Services
      # Used by: FlightDetectionService (ATC → Flight) AND ATCDetectionService (Flight → ATC)
      FLIGHT_DETECTION_TIME_WINDOW_SECONDS: "180"    # Time window for frequency matching (3 minutes)
      
      # Controller-specific proximity configuration (used by both services)
      # Both services use ControllerTypeDetector to get these ranges based on controller type
      CONTROLLER_PROXIMITY_GROUND_NM: "15"      # Ground controllers: 15nm (both services)
      CONTROLLER_PROXIMITY_TOWER_NM: "15"       # Tower controllers: 15nm (both services)
      CONTROLLER_PROXIMITY_APPROACH_NM: "60"    # Approach controllers: 60nm (both services)
      CONTROLLER_PROXIMITY_CENTER_NM: "400"     # Center controllers: 400nm (both services)
      CONTROLLER_PROXIMITY_FSS_NM: "1000"      # FSS controllers: 1000nm (both services)
      
      # Enable/disable controller-specific ranges (used by both services)
      ENABLE_CONTROLLER_SPECIFIC_RANGES: "true"
      
      # Enrichment Worker Configuration
      ENABLE_ENRICHMENT: "true"               # Toggle enrichment processing on/off
      MAX_ENRICHMENT_RETRIES: "1"               # Maximum number of retry attempts before permanent failure
      
      # Fallback proximity for unknown controller types (used by both services)
      CONTROLLER_PROXIMITY_DEFAULT_NM: "30"


    volumes:
      - ./logs:/app/logs:rw
      - ./config/australian_airspace_polygon.json:/app/airspace_sector_data/australian_airspace_polygon.json:ro
      - ./config/australian_airspace_sectors.geojson:/app/airspace_sector_data/australian_airspace_sectors.geojson:ro
      - ./config/controller_callsigns_list.txt:/app/airspace_sector_data/controller_callsigns_list.txt:ro
      - ./config/init.sql:/app/database/init.sql:ro
      # REMOVE FOR PRODUCTION - Test and debug files
      - ./pytest.ini:/app/pytest.ini:ro
      - ./tests:/app/tests:ro
    ports:
      - "8001:8001"
      #wait for postgres to be ready
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health || exit 1"]
      interval: 5m        # Check every 5 minutes
      timeout: 5s         # Lightweight endpoint should respond in <1 second
      start_period: 60s   # Grace period for container startup
      retries: 3          # Number of retries before marking unhealthy

    restart: unless-stopped

  # Daily integrity checker (SQL-only)
  integrity:
    image: postgres:16
    container_name: vatsim_integrity
    environment:
      PGHOST: postgres
      PGDATABASE: vatsim_data
      PGUSER: vatsim_user
      PGPASSWORD: vatsim_password
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./logs:/logs:rw
    command: >
      sh -c "echo $(date -u '+%Y-%m-%dT%H:%M:%SZ') Running integrity checks && 
      psql -v ON_ERROR_STOP=1 -f /scripts/flight_to_controller_integrity.sql && 
      psql -v ON_ERROR_STOP=1 -f /scripts/controller_to_flight_integrity.sql && 
      echo $(date -u '+%Y-%m-%dT%H:%M:%SZ') Integrity checks complete; echo Sleeping 24h && sleep 86400"
    restart: unless-stopped

