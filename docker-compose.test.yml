version: '3.8'
services:
  # Isolated PostgreSQL for testing - uses a separate volume so it can be removed safely
  postgres_test:
    image: postgres:16
    container_name: vatsim_postgres_test
    environment:
      POSTGRES_DB: vatsim_data_test
      POSTGRES_USER: vatsim_user
      POSTGRES_PASSWORD: vatsim_password
    volumes:
      - ./database/vatsim_test:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    ports:
      - "55432:5432" # different host port to avoid collisions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatsim_user -d vatsim_data_test"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Application (test) - uses same Dockerfile but isolated env vars and mounts
  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vatsim_app_test
    environment:
      DATABASE_URL: postgresql://vatsim_user:vatsim_password@postgres_test:5432/vatsim_data_test
      LOG_LEVEL: "DEBUG"
      ENABLE_BOUNDARY_FILTER: "false"
      FLIGHT_SUMMARY_ENABLED: "true"
      FLIGHT_SUMMARY_MAX_BATCH: 1
      FLIGHT_SUMMARY_POLL_INTERVAL_SHORT: 60
      FLIGHT_SUMMARY_POLL_INTERVAL_LONG: 300
      VATSIM_TRANSCEIVERS_POLLING_INTERVAL: 30
      VATSIM_POLLING_INTERVAL: 10
      VATSIM_API_RETRY_ATTEMPTS: 3
      CLEANUP_FLIGHT_TIMEOUT: 60
    volumes:
      - ./logs/test:/app/logs:rw
      - ./config/australian_airspace_polygon.json:/app/airspace_sector_data/australian_airspace_polygon.json:ro
      - ./config/australian_airspace_sectors.geojson:/app/airspace_sector_data/australian_airspace_sectors.geojson:ro
      - ./config/controller_callsigns_list.txt:/app/airspace_sector_data/controller_callsigns_list.txt:ro
    depends_on:
      postgres_test:
        condition: service_healthy
    ports:
      - "9001:8001"

  # Lightweight enrichment worker for testing (single-process)
  enrichment_worker_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vatsim_worker_test
    command: ["python", "-u", "app/services/summary_enrichment_worker.py"]
    environment:
      DATABASE_URL: postgresql://vatsim_user:vatsim_password@postgres_test:5432/vatsim_data_test
      LOG_LEVEL: "DEBUG"
    depends_on:
      postgres_test:
        condition: service_healthy
    volumes:
      - ./logs/test:/app/logs:rw

# Usage:
# Start: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build
# Teardown (including test DB): docker compose -f docker-compose.yml -f docker-compose.test.yml down -v


